<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangli Tugma Sozlagich</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }

    .header p {
      font-size: 12px;
      color: #94a3b8;
    }

    .panel {
      background: #1e293b;
      padding: 14px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .input-group input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* 30 Xil Rang Palitrasi */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding: 6px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .color-box {
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-box.selected {
      border-color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .buttons-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .added-btn-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-add {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-send {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-delete {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎨 Rangli Tugmalar Sozlamasi</h1>
    <p>Xabarga qo'shiladigan tugmalarni tanlang</p>
  </div>

  <div class="panel">
    <div class="input-group">
      <label>1. Tugma Nomi:</label>
      <input type="text" id="btn-text" placeholder="Masalan: 💅 Qizlar uchun TOP 5 ↗">
    </div>

    <div class="input-group">
      <label>2. Havola (Link):</label>
      <input type="url" id="btn-url" placeholder="https://t.me/ShriftlarUzBot">
    </div>

    <div class="input-group">
      <label>3. Rang tanlang (30 xil rang):</label>
      <div class="color-grid" id="color-grid"></div>
    </div>

    <button class="btn-add" onclick="addButton()">➕ Tugma Qo'shish</button>
  </div>

  <div class="panel">
    <div style="font-size: 13px; color: #cbd5e1; font-weight: 600;">Qo'shilgan Tugmalar (<span id="btn-count">0</span>):</div>
    <div class="buttons-list" id="buttons-list">
      <p style="font-size: 12px; color: #94a3b8; text-align: center;">Hozircha tugmalar yo'q</p>
    </div>
  </div>

  <button class="btn-send" onclick="sendDataToBot()">🚀 Xabarni Barchaga Yuborish</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const colorGradients = [
      "linear-gradient(135deg, #ef4444, #991b1b)",
      "linear-gradient(135deg, #f97316, #c2410c)",
      "linear-gradient(135deg, #f59e0b, #b45309)",
      "linear-gradient(135deg, #10b981, #047857)",
      "linear-gradient(135deg, #06b6d4, #0e7490)",
      "linear-gradient(135deg, #3b82f6, #1d4ed8)",
      "linear-gradient(135deg, #6366f1, #4338ca)",
      "linear-gradient(135deg, #8b5cf6, #6d28d9)",
      "linear-gradient(135deg, #d946ef, #a21caf)",
      "linear-gradient(135deg, #f43f5e, #be123c)",
      "linear-gradient(135deg, #84cc16, #4d7c0f)",
      "linear-gradient(135deg, #14b8a6, #0f766e)",
      "linear-gradient(135deg, #0284c7, #0369a1)",
      "linear-gradient(135deg, #a855f7, #7e22ce)",
      "linear-gradient(135deg, #ec4899, #be185d)",
      "linear-gradient(135deg, #fb7185, #e11d48)",
      "linear-gradient(135deg, #38bdf8, #0284c7)",
      "linear-gradient(135deg, #4ade80, #15803d)",
      "linear-gradient(135deg, #facc15, #ca8a04)",
      "linear-gradient(135deg, #fb923c, #ea580c)",
      "linear-gradient(135deg, #475569, #1e293b)",
      "linear-gradient(135deg, #94a3b8, #475569)",
      "linear-gradient(135deg, #78716c, #44403c)",
      "linear-gradient(135deg, #a16207, #713f12)",
      "linear-gradient(135deg, #0f766e, #134e4a)",
      "linear-gradient(135deg, #0369a1, #0c4a6e)",
      "linear-gradient(135deg, #4c1d95, #2e1065)",
      "linear-gradient(135deg, #831843, #500724)",
      "linear-gradient(135deg, #18181b, #09090b)",
      "linear-gradient(135deg, #e11d48, #4c1d95)"
    ];

    let selectedColorIndex = 0;
    let buttons = [];

    function initColorPicker() {
      const grid = document.getElementById("color-grid");
      grid.innerHTML = "";
      colorGradients.forEach((gradient, index) => {
        const box = document.createElement("div");
        box.className = `color-box ${index === 0 ? "selected" : ""}`;
        box.style.background = gradient;
        box.onclick = () => {
          document.querySelectorAll(".color-box").forEach(b => b.classList.remove("selected"));
          box.classList.add("selected");
          selectedColorIndex = index;
        };
        grid.appendChild(box);
      });
    }

    function addButton() {
      const text = document.getElementById("btn-text").value.trim();
      const url = document.getElementById("btn-url").value.trim();

      if (!text || !url) {
        alert("Tugma nomi va linkini kiriting!");
        return;
      }

      buttons.push({
        text: text,
        url: url,
        color: colorGradients[selectedColorIndex]
      });

      document.getElementById("btn-text").value = "";
      document.getElementById("btn-url").value = "";

      renderButtons();
    }

    function deleteButton(index) {
      buttons.splice(index, 1);
      renderButtons();
    }

    function renderButtons() {
      const list = document.getElementById("buttons-list");
      document.getElementById("btn-count").innerText = buttons.length;
      list.innerHTML = "";

      if (buttons.length === 0) {
        list.innerHTML = `<p style="font-size: 12px; color: #94a3b8; text-align: center;">Hozircha tugmalar yo'q</p>`;
        return;
      }

      buttons.forEach((btn, idx) => {
        const item = document.createElement("div");
        item.className = "added-btn-item";
        item.style.background = btn.color;
        item.innerHTML = `
          <span>${btn.text}</span>
          <button class="btn-delete" onclick="deleteButton(${idx})">❌</button>
        `;
        list.appendChild(item);
      });
    }

    function sendDataToBot() {
      const payload = { buttons: buttons };
      tg.sendData(JSON.stringify(payload));
    }

    initColorPicker();
  </script>
</body>
</html>
